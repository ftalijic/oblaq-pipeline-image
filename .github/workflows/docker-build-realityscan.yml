name: Build and Push RealityScan Linux Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.realityscan-linux'
      - 'entrypoint.sh'
      - '.github/workflows/docker-build-realityscan.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Free up disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Download RealityScan .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download realityscan-deb --pattern 'realityscan_*.deb' --dir .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.realityscan-linux
          push: true
          pull: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/oblaq-realityscan-linux:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
